name: Clean StockForge copy from stockpromt

on:
  push:
    paths:
      - .github/cleanup-stockforge-copy.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'ibank31/stockpromt'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove copied StockForge implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            data \
            deploy \
            frontend \
            src \
            tests \
            qa \
            scripts \
            docs \
            pyproject.toml \
            AGENTS.md \
            .github/e2e-prod-trigger.txt \
            .github/stockforge-zero-gpu-status.json \
            .github/workflows/bootstrap-copy.yml \
            .github/workflows/cleanup-stockforge-copy.yml \
            .github/cleanup-stockforge-copy.trigger

          cat > README.md <<'EOF'
# STOCKPROMT

Standalone microstock prompt compiler.

The active project lives in `prompt-studio/`.

Workflow:

1. Upload a reference image.
2. Analyze it with a multimodal model.
3. Produce five distinct, commercially useful, Adobe Stock-aware prompts.
4. Generate the image manually in a third-party app.
5. Upload the generated image for the separate upscaling stage.

This repository is independent from `stockforge-ai`.
EOF

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes detected.'
            exit 0
          fi
          git commit -m 'chore: remove copied StockForge implementation'
          git push
